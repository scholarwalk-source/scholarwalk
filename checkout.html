<style>
  .ticker-bar{
    position:relative; overflow:hidden; white-space:nowrap;
    background:linear-gradient(90deg, #2451B8, #1C8C6B);
    color:#fff; height:38px; display:flex; align-items:center;
  }
  .ticker-track{ display:flex; white-space:nowrap; animation:tickerScroll 26s linear infinite; will-change:transform; }
  .ticker-track span{ display:inline-flex; align-items:center; padding:0 36px; font-size:12.5px; font-weight:700; letter-spacing:.02em; flex-shrink:0; font-family:Arial,sans-serif; }
  @keyframes tickerScroll{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }
  html[dir="rtl"] .ticker-track{ animation:tickerScrollRtl 26s linear infinite; }
  @keyframes tickerScrollRtl{ from{ transform:translateX(0); } to{ transform:translateX(50%); } }
  .ticker-close{
    position:absolute; right:10px; top:50%; transform:translateY(-50%);
    width:22px; height:22px; border-radius:50%; background:rgba(255,255,255,.2);
    border:none; color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; cursor:pointer; z-index:2;
  }
  html[dir="rtl"] .ticker-close{ right:auto; left:10px; }
  .ticker-close svg{ width:12px; height:12px; }
  .ticker-close:hover{ background:rgba(255,255,255,.35); }
  @media(prefers-reduced-motion: reduce){ .ticker-track{ animation:none; overflow-x:auto; } }
</style>

<body>
<!-- ANNOUNCEMENT TICKER -->
<div class="ticker-bar" id="tickerBar">
  <div class="ticker-track" id="tickerTrack"></div>
  <button class="ticker-close" id="tickerClose" aria-label="Close announcement bar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
</div>
<script>
const TICKER_MESSAGES = {
  en: ["The Johns Hopkins - Public Service Scholarship - Apply NOW"],
  ar: ["منحة جونز هوبكنز للخدمة العامة - قدّم الآن"]
};
const bar = document.getElementById('tickerBar');
const track = document.getElementById('tickerTrack');
const SESSION_KEY = 'scholarwalk_ticker_dismissed';
function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
function renderTicker(lang){
  if(sessionStorage.getItem(SESSION_KEY)){ bar.style.display = 'none'; return; }
  const itemsHtml = TICKER_MESSAGES[lang].map(m => '<span>' + escapeHtml(m) + '</span>').join('');
  track.innerHTML = itemsHtml + itemsHtml;
}
renderTicker('en');
document.getElementById('tickerClose').addEventListener('click', (e)=>{
  e.stopPropagation();
  bar.style.display = 'none';
  sessionStorage.setItem(SESSION_KEY, '1');
});
bar.style.cursor = 'pointer';
bar.addEventListener('click', (e)=>{
  if(e.target.closest('.ticker-close')) return;
  window.location.href = 'pricing.html';
});
</script>

      </div>

      <button class="pay-btn" id="payBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
        ${L.pay_btn(escapeHtml(data.price))}
      </button>
      <p class="secure-note">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 4 5v6c0 5 3.4 8.7 8 11 4.6-2.3 8-6 8-11V5l-8-3Z"/></svg>
        ${L.secure_note}
      </p>
      <a href="signup.html" class="edit-link">${L.edit_link}</a>

      <div class="setup-note">
        <strong>${L.setup_title}</strong>
        ${L.setup_body}
      </div>
    </div>`;

  document.getElementById('payBtn').addEventListener('click', ()=> redirectToStripeCheckout(data, lang));
}

function applyLang(lang){
  currentLang = lang;
  try{ localStorage.setItem('scholarwalk_lang', lang); }catch(e){}
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.getElementById('langLabel').textContent = lang === 'ar' ? 'AR' : 'EN';
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if(t[lang][key] !== undefined) el.textContent = t[lang][key];
  });
  renderApp(lang);
  renderTicker(lang);
}
document.getElementById('langToggle').addEventListener('click', ()=>{
  applyLang(currentLang === 'en' ? 'ar' : 'en');
});

/**
 * STRIPE CHECKOUT HANDLER — see original notes; unchanged behavior,
 * now also passes the active language through for the error alert text.
 */
function redirectToStripeCheckout(data, lang){
  const url = STRIPE_LINKS[data.package];
  if(!url || url.includes('REPLACE_WITH')){
    alert(t[lang].stripe_not_setup(data.packageLabel));
    return;
  }
  const checkoutUrl = new URL(url);
  if(data.email) checkoutUrl.searchParams.set('prefilled_email', data.email);
  const referenceId = (data.email ? data.email.replace(/[^a-zA-Z0-9]/g, '_') : 'applicant') + '_' + Date.now();
  checkoutUrl.searchParams.set('client_reference_id', referenceId);
  window.location.href = checkoutUrl.toString();
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

let savedLang = 'ar';
try{ savedLang = localStorage.getItem('scholarwalk_lang') || 'ar'; }catch(e){}
applyLang(savedLang);
</script>
</body>
